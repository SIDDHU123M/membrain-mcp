<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Membrain</title>
    <script>
      // paper by day is the ledger's native state; night ledger on request
      const savedTheme = localStorage.getItem('theme') || localStorage.getItem('themePreference') || localStorage.theme;
      const theme = savedTheme === 'dark' ? 'dark' : 'light';
      document.documentElement.dataset.theme = theme;
      document.documentElement.classList.toggle('dark', theme === 'dark');
    </script>
    <!-- the ledger's stamp: serif M inked on a paper plate -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2218%22 fill=%22%23f4f1e8%22/><rect x=%227%22 y=%227%22 width=%2286%22 height=%2286%22 rx=%2212%22 fill=%22none%22 stroke=%22%231c1917%22 stroke-width=%225%22/><text x=%2250%22 y=%2270%22 font-family=%22Georgia,serif%22 font-size=%2256%22 font-weight=%22bold%22 text-anchor=%22middle%22 fill=%22%231c1917%22>M</text></svg>" />
  </head>

    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
